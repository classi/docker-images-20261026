name: build-ruby
run-name: build-ruby ${{ inputs.ruby_version }}

on:
  workflow_dispatch:
    inputs:
      ruby_version:
        description: Ruby version (3.3.x, 3.4.x or 4.0.x)
        required: true
        type: string
      sha256:
        description: SHA256 of ruby-<version>.tar.xz
        required: true
        type: string

permissions: {}

concurrency:
  group: build-ruby-${{ inputs.ruby_version }}
  cancel-in-progress: false

env:
  RUBY_VERSION: ${{ inputs.ruby_version }}
  RUBY_DOWNLOAD_SHA256: ${{ inputs.sha256 }}
  BUILDX_BAKE_FILE: docker-bake.ruby.hcl

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: targets
        run: echo "targets=$(docker buildx bake --print | jq -c '.target | keys')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx bake --load --progress=plain "$TARGET"
      - run: ./test/smoke-ruby.sh "$(docker buildx bake --print "$TARGET" | jq -r '.target[].tags[0]')" "$RUBY_VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx bake --push "$TARGET"
